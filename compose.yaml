# GatedOps: the canonical loop in one command.
#
#   docker compose up --build
#
# Brings up the MLflow registry, trains and promotes a model through the gate
# (init), then starts the scoring API against the production alias. The
# MLflow UI is reachable at http://localhost:5001 and the API at
# http://localhost:8000.
name: gatedops

services:
  mlflow:
    image: gatedops:local
    build:
      context: .
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  init:
    image: gatedops:local
    build:
      context: .
    command:
      - python
      - -m
      - gatedops
      - demo
      - good
      - --tracking-uri
      - http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    image: gatedops:local
    build:
      context: .
    command:
      - uvicorn
      - gatedops.serve.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      GATEDOPS_TRACKING_URI: http://mlflow:5000
      GATEDOPS_MODEL_NAME: churn-classifier
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mlflow-data:
